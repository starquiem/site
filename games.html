<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games - Minimalist Hub</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div id="loader-overlay">
        <div class="loader-title">LOADING GAMES...</div>
        <div class="loader-bar-container">
            <div id="loader-bar" class="loader-bar"></div>
        </div>
    </div>

    <canvas id="bg-canvas"></canvas>

    <div id="app-container" class="sidebar-left">
        <!-- Navigation Bar -->
        <nav class="nav-bar">
            <a href="./index.html" class="nav-link" id="nav-index" title="Home">
                <svg viewBox="0 0 24 24" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            </a>

            <div class="nav-divider"></div>
            <div class="nav-section-title">Categories</div>

            <a href="./games.html" class="nav-link active" id="nav-games" title="Games">
                <svg viewBox="0 0 24 24" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"></rect><path d="M6 12h4m-2-2v4m8-2h.01m2 0h.01"></path></svg>
            </a>
            <a href="./media.html" class="nav-link" id="nav-media" title="Media">
                <svg viewBox="0 0 24 24" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect><polyline points="17 2 12 7 7 2"></polyline></svg>
            </a>

            <div class="nav-divider"></div>

            <a href="./favorites.html" class="nav-link" id="nav-favorites" title="Favorites">
                <svg viewBox="0 0 24 24" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            </a>
            <a href="./settings.html" class="nav-link" id="nav-settings" title="Settings">
                <svg viewBox="0 0 24 24" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </a>
        </nav>

        <main class="content">
            <div class="recommended-banner">
                <h2>Game Library</h2>
                <p>Jump directly into your hand-picked selection of games.</p>
            </div>

            <div class="search-container">
                <input type="text" id="searchInput" class="search-bar" placeholder="Search games...">
            </div>

            <!-- Manually added games go inside this grid -->
            <div id="content-grid" class="grid-container">
                
                <!-- GAME 1: Subway Surfers -->
                <div class="card" 
                     data-id="game-1" 
                     data-title="Subway Surfers" 
                     data-img="https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=500&auto=format&fit=crop&q=60" 
                     data-src="https://math-games-9m2.pages.dev/subway-surfers">
                     
                    <button class="fav-btn">☆</button>
                    <a href="./play.html?src=https://math-games-9m2.pages.dev/subway-surfers&title=Subway%20Surfers&id=game-1" class="play-link" style="text-decoration: none; color: inherit; display: flex; flex-direction: column; flex: 1;">
                        <div class="card-img-container">
                            <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=500&auto=format&fit=crop&q=60" alt="Subway Surfers">
                        </div>
                        <div class="card-title">Subway Surfers</div>
                    </a>
                </div>

                <!-- GAME 2: Minecraft Classic -->
                <div class="card" 
                     data-id="game-2" 
                     data-title="Minecraft Classic" 
                     data-img="https://images.unsplash.com/photo-1614316311790-1c6f71d53e20?w=500&auto=format&fit=crop&q=60" 
                     data-src="https://classic.minecraft.net/">
                     
                    <button class="fav-btn">☆</button>
                    <a href="./play.html?src=https://classic.minecraft.net/&title=Minecraft%20Classic&id=game-2" class="play-link" style="text-decoration: none; color: inherit; display: flex; flex-direction: column; flex: 1;">
                        <div class="card-img-container">
                            <img src="https://images.unsplash.com/photo-1614316311790-1c6f71d53e20?w=500&auto=format&fit=crop&q=60" alt="Minecraft Classic">
                        </div>
                        <div class="card-title">Minecraft Classic</div>
                    </a>
                </div>

            </div>
        </main>
    </div>

    <!-- The script automatically syncs stars and recently played history -->
    <script type="module" src="./script.js"></script>
</body>
</html>
