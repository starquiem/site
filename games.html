<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Games - GameStash</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">⚡ GameStash</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="games.html">Games</a>
            <a href="favorites.html">Favorites</a>
            <a href="settings.html">Settings</a>
            <a href="https://discord.gg/yourinvite" target="_blank" class="discord-btn">Discord</a>
        </nav>
    </header>

    <main>
        <h2>All Games</h2>
        <input type="text" id="searchBar" placeholder="Search games..." style="width: 100%; padding: 0.75rem 1rem; margin-bottom: 1.5rem; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-size: 1rem; outline: none;">
        <div class="grid" id="gamesGrid">
            <a href="play.html?game=retro-bowl" class="card">
                <div class="card-img">Thumbnail</div>
                <div class="card-title">Retro Bowl</div>
            </a>
            <a href="play.html?game=slope" class="card">
                <div class="card-img">Thumbnail</div>
                <div class="card-title">Slope</div>
            </a>
            <a href="play.html?game=cookie-clicker" class="card">
                <div class="card-img">Thumbnail</div>
                <div class="card-title">Cookie Clicker</div>
            </a>
            <a href="play.html?game=1v1-lol" class="card">
                <div class="card-img">Thumbnail</div>
                <div class="card-title">1v1.lol</div>
            </a>
            <a href="play.html?game=core-ball" class="card">
                <div class="card-img">Thumbnail</div>
                <div class="card-title">Core Ball</div>
            </a>
            <a href="play.html?game=paper-io-2" class="card">
                <div class="card-img">Thumbnail</div>
                <div class="card-title">Paper.io 2</div>
            </a>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
