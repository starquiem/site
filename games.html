<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games - Minimalist Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    
    <div id="app-container" class="sidebar-left">
        <nav class="nav-bar">
            <a href="index.html" class="nav-link" title="Home">🏠</a>
            <a href="games.html" class="nav-link active" title="Games">🎮</a>
            <a href="shows.html" class="nav-link" title="Shows">📺</a>
            <a href="favorites.html" class="nav-link" title="Favorites">⭐</a>
            <a href="settings.html" class="nav-link" title="Settings">⚙️</a>
        </nav>

        <main class="content">
            <div class="search-container">
                <input type="text" id="search-bar" class="search-bar" placeholder="Search games...">
            </div>

            <!-- ID matches the JS sort function -->
            <div id="catalog-grid" class="grid">
                
                <!-- Example Game Card -->
                <div class="card">
                    <button class="fav-btn" onclick="window.toggleFavorite('game-1v1lol', '1v1.lol', 'https://via.placeholder.com/300x200', this, event)">☆</button>
                    <a href="play.html?src=https://example.com&id=game-1v1lol" style="text-decoration: none; color: inherit; display: flex; flex-direction: column; flex: 1;">
                        <div class="card-img-container">
                            <img src="https://via.placeholder.com/300x200" alt="1v1.lol">
                        </div>
                        <div class="card-title">1v1.lol</div>
                    </a>
                    <div class="card-actions" data-game-id="game-1v1lol">
                        <div class="rating-group">
                            <button class="rate-btn rate-like" onclick="window.handleRating('game-1v1lol', 'like', this, event)">👍 0</button>
                            <button class="rate-btn rate-dislike" onclick="window.handleRating('game-1v1lol', 'dislike', this, event)">👎 0</button>
                        </div>
                    </div>
                </div>
                
                <!-- Example Game Card 2 -->
                <div class="card">
                    <button class="fav-btn" onclick="window.toggleFavorite('game-minecraft', 'Minecraft Classic', 'https://via.placeholder.com/300x200', this, event)">☆</button>
                    <a href="play.html?src=https://classic.minecraft.net/&id=game-minecraft" style="text-decoration: none; color: inherit; display: flex; flex-direction: column; flex: 1;">
                        <div class="card-img-container">
                            <img src="https://via.placeholder.com/300x200" alt="Minecraft Classic">
                        </div>
                        <div class="card-title">Minecraft Classic</div>
                    </a>
                    <div class="card-actions" data-game-id="game-minecraft">
                        <div class="rating-group">
                            <button class="rate-btn rate-like" onclick="window.handleRating('game-minecraft', 'like', this, event)">👍 0</button>
                            <button class="rate-btn rate-dislike" onclick="window.handleRating('game-minecraft', 'dislike', this, event)">👎 0</button>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>
    
    <script type="module" src="script.js"></script>
</body>
</html>
