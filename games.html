<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games - Minimalist Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    
    <div id="app-container" class="sidebar-left">
        <nav class="nav-bar">
            <a href="index.html" class="nav-link">Home</a>
            <a href="games.html" class="nav-link active">Games</a>
            <a href="shows.html" class="nav-link">Shows</a>
            <a href="favorites.html" class="nav-link">⭐ Favs</a>
            <a href="settings.html" class="nav-link">⚙️</a>
        </nav>

        <main class="content">
            <h2>Games Library</h2>
            <div class="search-container">
                <input type="text" id="search-bar" class="search-bar" placeholder="Search games...">
            </div>
            
            <div class="grid" id="catalog-grid">
                <div class="card">
                    <button class="fav-btn" onclick="window.toggleFavorite('game1', 'Among Us', 'https://via.placeholder.com/160x200', this, event)">☆</button>
                    <a href="play.html" style="text-decoration: none; color: inherit; height: 100%; display: flex; flex-direction: column;">
                        <div class="card-title">Among Us</div>
                        <div class="card-img-container"><img src="https://via.placeholder.com/160x200" alt="Among Us"></div>
                    </a>
                </div>
                <div class="card">
                    <button class="fav-btn" onclick="window.toggleFavorite('game2', 'Block Puzzle', 'https://via.placeholder.com/160x200', this, event)">☆</button>
                    <a href="play.html" style="text-decoration: none; color: inherit; height: 100%; display: flex; flex-direction: column;">
                        <div class="card-title">Block Puzzle</div>
                        <div class="card-img-container"><img src="https://via.placeholder.com/160x200" alt="Block Puzzle"></div>
                    </a>
                </div>
                <div class="card">
                    <button class="fav-btn" onclick="window.toggleFavorite('game3', '2D Racer', 'https://via.placeholder.com/160x200', this, event)">☆</button>
                    <a href="play.html" style="text-decoration: none; color: inherit; height: 100%; display: flex; flex-direction: column;">
                        <div class="card-title">2D Racer</div>
                        <div class="card-img-container"><img src="https://via.placeholder.com/160x200" alt="2D Racer"></div>
                    </a>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
