<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play - GameStash</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">⚡ GameStash</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="games.html">Games</a>
            <a href="favorites.html">Favorites</a>
            <a href="settings.html">Settings</a>
            <a href="https://discord.gg/yourinvite" target="_blank" class="discord-btn">Discord</a>
        </nav>
    </header>

    <main style="display: flex; flex-direction: column; align-items: center;">
        <div style="width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <h2 id="gameTitle" style="margin: 0;">Loading Game...</h2>
            <button id="fullscreenBtn" style="background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer;">Fullscreen</button>
        </div>
        <div style="width: 100%; height: 75vh; background: #000; border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden;">
            <iframe id="gameFrame" src="" style="width: 100%; height: 100%; border: none;"></iframe>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
