<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play - Minimalist Hub</title>
    <link rel="stylesheet" href="./style.css">
    <style>
        /* Player specific styles to fix squished iframe bug */
        .play-layout {
            padding: 30px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .top-controls {
            margin-bottom: 20px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
            font-weight: 600;
        }

        .back-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.1);
        }

        .player-container {
            flex: 1; /* This forces the container to take up all remaining screen space */
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
        }

        .player-header {
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.2);
        }

        .player-header h2 {
            margin: 0;
            color: var(--accent-color);
            font-size: 1.5rem;
        }

        .fullscreen-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: rgba(255,255,255,0.08);
            color: var(--text-main);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .fullscreen-btn:hover {
            background: rgba(255,255,255,0.15);
        }

        /* The actual iframe fix */
        .iframe-wrapper {
            flex: 1; /* Takes up the rest of the player container */
            width: 100%;
        }

        .iframe-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block; /* Removes inline spacing bugs */
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div id="app-container" style="margin-left: 0;"> <!-- Overriding sidebar margin for full width -->
        <main class="play-layout">
            
            <div class="top-controls">
                <a href="#" onclick="history.back(); return false;" class="back-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    Back to Hub
                </a>
            </div>

            <div class="player-container">
                <div class="player-header">
                    <h2 id="game-title">Loading...</h2>
                    <button id="fullscreen-btn" class="fullscreen-btn">Fullscreen</button>
                </div>
                
                <div class="iframe-wrapper">
                    <iframe id="game-frame" src="" allowfullscreen></iframe>
                </div>
            </div>

        </main>
    </div>

    <script>
        // Reads the URL query parameters
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const src = params.get('src');
            const title = params.get('title');

            if(title) document.getElementById('game-title').textContent = title;
            if(src) document.getElementById('game-frame').src = src;

            // Fullscreen Functionality
            const fullscreenBtn = document.getElementById('fullscreen-btn');
            const iframe = document.getElementById('game-frame');

            fullscreenBtn.addEventListener('click', () => {
                if (iframe.requestFullscreen) {
                    iframe.requestFullscreen();
                } else if (iframe.webkitRequestFullscreen) { /* Safari */
                    iframe.webkitRequestFullscreen();
                } else if (iframe.msRequestFullscreen) { /* IE11 */
                    iframe.msRequestFullscreen();
                }
            });
        });
    </script>
    <script type="module" src="./script.js"></script>
</body>
</html>
