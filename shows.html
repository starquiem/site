<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Hub - Shows</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📺</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="bg-canvas"></canvas>

<div class="grid" id="catalog-grid">
    </div>
    
    <div id="app-container" class="sidebar-left">
        <nav class="nav-bar">
            <a href="index.html" class="nav-link">Home</a>
            <a href="games.html" class="nav-link">Games</a>
            <a href="shows.html" class="nav-link active">Shows</a>
            <a href="favorites.html" class="nav-link">⭐ Favs</a>
            <a href="settings.html" class="nav-link">⚙️</a>
        </nav>

        <main class="content">
            <h2>Shows Collection</h2>
            
            <div class="search-container">
                <input type="text" id="search-bar" class="search-bar" placeholder="Search for a show...">
            </div>

            <div class="grid">
                <div class="card">
                    <button class="fav-btn" onclick="toggleFavorite('s1', 'Anime Series', 'https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=300&q=80', this, event)">☆</button>
                    <a href="play.html" style="text-decoration: none; color: inherit; height: 100%; display: flex; flex-direction: column;">
                        <div class="card-title">Anime Series</div>
                        <div class="card-img-container">
                            <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=300&q=80" alt="Anime Series">
                        </div>
                    </a>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const savedFavs = JSON.parse(localStorage.getItem('favorites')) || [];
            document.querySelectorAll('.fav-btn').forEach(btn => {
                const funcText = btn.getAttribute('onclick');
                const idMatch = funcText.match(/'([^']+)'/);
                if(idMatch && savedFavs.some(f => f.id === idMatch[1])) {
                    btn.classList.add('active');
                    btn.innerHTML = '★';
                }
            });
        });
    </script>
</body>
</html>
