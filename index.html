<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Hub - Catalog</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div id="loader-overlay">
        <div class="loader-title">LOADING HUB...</div>
        <div class="loader-bar-container">
            <div id="loader-bar" class="loader-bar"></div>
        </div>
    </div>

    <canvas id="bg-canvas"></canvas>

    <div id="app-container" class="sidebar-left">
        <nav class="nav-bar">
            <a href="./index.html" class="nav-link active" id="nav-index" title="Catalog">
                <svg viewBox="0 0 24 24" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            </a>

            <div class="nav-divider"></div>
            <div class="nav-section-title">Categories</div>

            <a href="./games.html" class="nav-link" id="nav-games" title="Games">
                <svg viewBox="0 0 24 24" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"></rect><path d="M6 12h4m-2-2v4m8-2h.01m2 0h.01"></path></svg>
            </a>
            <a href="./shows.html" class="nav-link" id="nav-shows" title="Shows">
                <svg viewBox="0 0 24 24" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect><polyline points="17 2 12 7 7 2"></polyline></svg>
            </a>

            <div class="nav-divider"></div>

            <a href="./favorites.html" class="nav-link" id="nav-favorites" title="Favorites">
                <svg viewBox="0 0 24 24" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            </a>
            <a href="./settings.html" class="nav-link" id="nav-settings" title="Settings">
                <svg viewBox="0 0 24 24" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </a>

            <div class="nav-divider"></div>

            <a href="https://discord.gg/znuBx9cMDT" target="_blank" class="nav-link discord-link" title="Join Discord">
                <svg viewBox="0 0 24 24" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 6h0a8.5 8.5 0 0 0-7-3.5c-3.2 0-6 1.8-7.5 4.5A11 11 0 0 0 2 16.5c1.5 2 4 3 6.5 2.5a8.5 8.5 0 0 0 3-1.5m6.5-11.5a10 10 0 0 1-3.5 6m3.5-6L17.5 9m-4.5 4.5h.01m3.99 0h.01"></path>
                </svg>
            </a>
        </nav>

        <main class="content">
            <div class="search-container">
                <input type="text" id="search-bar" class="search-bar" placeholder="Search catalog...">
            </div>

            <!-- Centered Discord Banner Button -->
            <div class="discord-banner-container">
                <a href="https://discord.gg/znuBx9cMDT" target="_blank" class="discord-cta-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 6h0a8.5 8.5 0 0 0-7-3.5c-3.2 0-6 1.8-7.5 4.5A11 11 0 0 0 2 16.5c1.5 2 4 3 6.5 2.5a8.5 8.5 0 0 0 3-1.5m6.5-11.5a10 10 0 0 1-3.5 6m3.5-6L17.5 9m-4.5 4.5h.01m3.99 0h.01"></path>
                    </svg>
                    <span>Join the Discord!</span>
                </a>
            </div>

            <!-- Featured Slideshow Section -->
            <div class="section-header">Featured Games</div>
            <div class="slideshow-container">
                <div class="slide fade active" style="background-image: url('https://via.placeholder.com/900x300/222/555');">
                    <div class="slide-caption">
                        <h3>1v1.lol</h3>
                        <p>Build, shoot, and survive in this fast-paced action game.</p>
                        <a href="./play.html?src=https://example.com&id=game-1v1lol" class="btn-primary" onclick="trackRecent('1v1.lol', 'https://via.placeholder.com/300x200', 'https://example.com', 'game-1v1lol')">Play Now</a>
                    </div>
                </div>
                <div class="slide fade" style="background-image: url('https://via.placeholder.com/900x300/333/666');">
                    <div class="slide-caption">
                        <h3>Sample Game 2</h3>
                        <p>Discover new adventures and challenges every day.</p>
                        <a href="./play.html?src=https://example.com&id=game-sample2" class="btn-primary" onclick="trackRecent('Sample Game 2', 'https://via.placeholder.com/300x200', 'https://example.com', 'game-sample2')">Play Now</a>
                    </div>
                </div>
                <button class="slide-prev" onclick="plusSlides(-1)">&#10094;</button>
                <button class="slide-next" onclick="plusSlides(1)">&#10095;</button>
            </div>

            <!-- Recently Played Section -->
            <div class="section-header">Recently Played</div>
            <div id="recent-grid" class="grid">
                <!-- Dynamically populated via script.js -->
            </div>

            <!-- Catalog Grid -->
            <div class="section-header">All Games & Shows</div>
            <div id="catalog-grid" class="grid">
                <div class="card" data-game-id="game-1v1lol">
                    <button class="fav-btn" onclick="toggleFavorite(event, 'game-1v1lol')">☆</button>
                    <a href="./play.html?src=https://example.com&id=game-1v1lol" onclick="trackRecent('1v1.lol', 'https://via.placeholder.com/300x200', 'https://example.com', 'game-1v1lol')" style="text-decoration: none; color: inherit; display: flex; flex-direction: column; flex: 1;">
                        <div class="card-img-container"><img src="https://via.placeholder.com/300x200" alt="1v1.lol"></div>
                        <div class="card-title">1v1.lol</div>
                    </a>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="./script.js"></script>
</body>
</html>
