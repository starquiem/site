<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Minimalist Hub</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div id="loader-overlay">
        <div class="loader-title">LOADING SETTINGS...</div>
        <div class="loader-bar-container">
            <div id="loader-bar" class="loader-bar"></div>
        </div>
    </div>

    <canvas id="bg-canvas"></canvas>

    <div id="app-container">
        <!-- Navigation Bar -->
        <nav class="nav-bar">
            <a href="./index.html" class="nav-link" title="Home">
                <svg viewBox="0 0 24 24" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            </a>

            <div class="nav-divider"></div>
            <div class="nav-section-title">Categories</div>

            <a href="./games.html" class="nav-link" title="Games">
                <svg viewBox="0 0 24 24" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"></rect><path d="M6 12h4m-2-2v4m8-2h.01m2 0h.01"></path></svg>
            </a>
            <a href="./media.html" class="nav-link" title="Media">
                <svg viewBox="0 0 24 24" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect><polyline points="17 2 12 7 7 2"></polyline></svg>
            </a>

            <div class="nav-divider"></div>

            <a href="./favorites.html" class="nav-link" title="Favorites">
                <svg viewBox="0 0 24 24" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            </a>
            <a href="./settings.html" class="nav-link active" title="Settings">
                <svg viewBox="0 0 24 24" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </a>
        </nav>

        <main class="content">
            <div class="recommended-banner">
                <h2>Hub Settings</h2>
                <p>Personalize your visual themes, background animations, and account session.</p>
            </div>

            <div style="background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 25px; max-width: 600px;">
                <h3 style="margin-top: 0; margin-bottom: 15px; font-size: 1.1rem; color: var(--accent-color);">Appearance</h3>
                
                <div style="margin-bottom: 20px;">
                    <label style="display: block; font-size: 0.9rem; margin-bottom: 8px; color: var(--text-muted);">Visual Theme</label>
                    <select id="theme-select" class="search-bar" style="max-width: 100%;">
                        <option value="dark">Dark Theme</option>
                        <option value="light-mode">Light Theme</option>
                        <option value="hacker-mode">Hacker Matrix</option>
                        <option value="sakura-mode">Sakura Blossom</option>
                        <option value="synthwave-mode">Synthwave Grid</option>
                    </select>
                </div>

                <div style="margin-bottom: 25px;">
                    <label style="display: block; font-size: 0.9rem; margin-bottom: 8px; color: var(--text-muted);">Background Particles</label>
                    <select id="particle-select" class="search-bar" style="max-width: 100%;">
                        <option value="default">Normal Stars</option>
                        <option value="fast">Fast Warp</option>
                        <option value="snow">Snowfall</option>
                        <option value="none">Disabled</option>
                    </select>
                </div>

                <h3 style="margin-top: 0; margin-bottom: 15px; font-size: 1.1rem; color: var(--accent-color);">Account & Data</h3>
                <div>
                    <button id="github-login-btn" style="padding: 10px 20px; background: rgba(255,255,255,0.08); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; cursor: pointer; font-weight: 600;">Sign in with GitHub</button>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="./script.js"></script>
</body>
</html>
