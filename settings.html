<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Minimalist Hub</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚙️</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    
    <div id="app-container" class="sidebar-left">
        <nav class="nav-bar">
            <a href="index.html" class="nav-link">Home</a>
            <a href="games.html" class="nav-link">Games</a>
            <a href="shows.html" class="nav-link">Shows</a>
            <a href="favorites.html" class="nav-link">⭐ Favs</a>
            <a href="settings.html" class="nav-link active">⚙️</a>
        </nav>

        <main class="content">
            <h2>Settings</h2>
            
            <div class="setting-group">
                <label for="pos-select">Navigation Layout:</label><br>
                <select id="pos-select" onchange="updateSidebarPos(this.value)">
                    <option value="sidebar-left">Left Side</option>
                    <option value="sidebar-right">Right Side</option>
                    <option value="sidebar-bottom">Bottom Bar</option>
                </select>
            </div>

            <!-- NEW AUTO-FADE SETTING -->
            <div class="setting-group">
                <label for="visibility-select">Sidebar Visibility:</label><br>
                <select id="visibility-select" onchange="updateSidebarVisibility(this.value)">
                    <option value="always">Always Visible</option>
                    <option value="autohide">Fade In on Hover</option>
                </select>
            </div>

            <div class="setting-group">
                <label for="bg-select">Background Animation:</label><br>
                <select id="bg-select" onchange="updateBgMode(this.value)">
                    <option value="particles">Floating Particles</option>
                    <option value="matrix">Matrix Rain</option>
                    <option value="none">Solid Dark</option>
                </select>
            </div>

            <div class="setting-group">
                <label for="color-picker">Accent Border Color:</label><br>
                <input type="color" id="color-picker" onchange="updateBorderColor(this.value)">
            </div>

            <div class="setting-group">
                <label>Cloud Sync:</label>
                <p style="font-size: 12px; color: #888; margin-top: 5px;">Save your favorites to the cloud.</p>
                <button id="login-btn" class="github-btn" onclick="loginWithGitHub()">
                    <svg height="24" width="24" fill="currentColor" viewBox="0 0 24 24" style="margin-right: 5px;"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"></path></svg>
                    Sign in with GitHub
                </button>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
