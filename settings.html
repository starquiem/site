    <div id="app-container" class="sidebar-left">

            <a href="./games.html" class="nav-link" id="nav-games" title="Games">
                <svg viewBox="0 0 24 24" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"></rect><path d="M6 12h4m-2-2v4m8-2h.01m2 0h.01"></path></svg>

            <a href="./favorites.html" class="nav-link" id="nav-favorites" title="Favorites">

            <div class="nav-divider"></div>

            <a href="https://discord.gg/znuBx9cMDT" target="_blank" class="nav-link discord-link" title="Join Discord">

                    <path d="M18 6h0a8.5 8.5 0 0 0-7-3.5c-3.2 0-6 1.8-7.5 4.5A11 11 0 0 0 2 16.5c1.5 2 4 3 6.5 2.5a8.5 8.5 0 0 0 3-1.5m6.5-11.5a10 10 0 0 1-3.5 6m3.5-6L17.5 9m-4.5 4.5h.01m3.99 0h.01"></path>

        <main class="content">
            <!-- Enlarged Banner -->
            <div class="recommended-banner">
                <h2>Hub Settings</h2>
                <p>Personalize your visual themes, background animations, and account session.</p>
            </div>

            <!-- Appearance Settings Section -->
            <div class="settings-section">
                <h3 style="margin-bottom: 20px; font-size: 1.5rem;">Appearance</h3>
                
                <div style="margin-bottom: 25px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-muted);">Visual Theme</label>
                    <select id="theme-select" class="settings-dropdown">
                        <option value="dark">Dark Mode (Default)</option>
                        <option value="light-mode">Light Mode</option>
                        <option value="hacker-mode">Hacker Matrix</option>
                        <option value="sakura-mode">Sakura Blossom</option>
                        <option value="synthwave-mode">Synthwave Neon</option>
                    </select>
                </div>

                <div>
                    <label style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-muted);">Background Particles</label>
                    <select id="particle-select" class="settings-dropdown">
                        <option value="default">Default Floating</option>
                        <option value="fast">Hyperspace</option>
                        <option value="snow">Snowfall</option>
                        <option value="none">Disabled</option>
                    </select>
                </div>
            </div>

            <!-- Account Settings Section -->
            <div class="settings-section">
                <h3 style="margin-bottom: 20px; font-size: 1.5rem;">Account & Data</h3>
                <div>
                    <button id="github-login-btn" class="auth-btn">Sign in with GitHub</button>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="./script.js"></script>
</body>
</html>
