<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - GameStash</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">⚡ GameStash</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="games.html">Games</a>
            <a href="favorites.html">Favorites</a>
            <a href="settings.html">Settings</a>
            <a href="https://discord.gg/yourinvite" target="_blank" class="discord-btn">Discord</a>
        </nav>
    </header>

    <main>
        <h2>Site Settings</h2>
        <div style="background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem;">
            <div>
                <h3 style="margin-top: 0; font-size: 1.1rem;">About:Blank Cloak</h3>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem;">Opens the site in a blank browser tab layer to hide history activity.</p>
                <button id="cloakBtn" style="background: var(--accent-color); color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 8px; font-weight: 500; cursor: pointer;">Open Cloaked</button>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
