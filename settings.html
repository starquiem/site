<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Minimalist Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    
    <div id="app-container" class="sidebar-left">
        <nav class="nav-bar">
            <a href="index.html" class="nav-link">Home</a>
            <a href="games.html" class="nav-link">Games</a>
            <a href="shows.html" class="nav-link">Shows</a>
            <a href="favorites.html" class="nav-link">⭐ Favs</a>
            <a href="settings.html" class="nav-link active">⚙️</a>
        </nav>

        <main class="content">
            <h2>Settings</h2>
            
            <div class="setting-group">
                <label for="theme-select">Interface Theme:</label><br>
                <select id="theme-select" onchange="window.updateTheme(this.value)">
                    <option value="dark">Dark Mode</option>
                    <option value="light">Light Mode</option>
                </select>
            </div>

            <div class="setting-group">
                <label for="pos-select">Navigation Layout:</label><br>
                <select id="pos-select" onchange="window.updateSidebarPos(this.value)">
                    <option value="sidebar-left">Left Side</option>
                    <option value="sidebar-right">Right Side</option>
                    <option value="sidebar-bottom">Bottom Bar</option>
                </select>
            </div>

            <div class="setting-group">
                <label for="visibility-select">Sidebar Visibility:</label><br>
                <select id="visibility-select" onchange="window.updateSidebarVisibility(this.value)">
                    <option value="always">Always Visible</option>
                    <option value="autohide">Fade In on Hover</option>
                </select>
            </div>

            <div class="setting-group">
                <label for="bg-select">Background Animation:</label><br>
                <select id="bg-select" onchange="window.updateBgMode(this.value)">
                    <option value="particles">Floating Particles</option>
                    <option value="matrix">Matrix Rain</option>
                    <option value="snow">Gentle Snow</option>
                    <option value="fireflies">Glowing Fireflies</option>
                    <option value="none">Solid Background</option>
                </select>
            </div>

            <div class="setting-group">
                <label for="color-picker">Accent Border Color:</label><br>
                <input type="color" id="color-picker" onchange="window.updateBorderColor(this.value)">
            </div>

            <div class="setting-group">
                <label>Save Data Backup:</label>
                <p style="font-size: 12px; color: #888; margin-top: 5px;">Export settings & favorites or restore a backup file.</p>
                <div class="data-controls">
                    <button class="data-btn" onclick="window.exportSaveData()">📤 Export Save</button>
                    <button class="data-btn" onclick="document.getElementById('import-file').click()">📥 Import Save</button>
                    <input type="file" id="import-file" style="display: none;" accept=".json" onchange="window.importSaveData(event)">
                </div>
            </div>

            <div class="setting-group">
                <label>Cloud Authentication:</label>
                <button id="login-btn" class="github-btn" onclick="window.loginWithGitHub()">
                    Sign in with GitHub
                </button>
            </div>
        </main>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
